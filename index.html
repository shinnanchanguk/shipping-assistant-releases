<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>택배 비서 다운로드</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8F9FA;
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .version { color: #64748B; font-size: 14px; margin-bottom: 24px; }
    .desc { color: #475569; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #2563EB; color: white; border: none; border-radius: 12px;
      padding: 14px 32px; font-size: 16px; font-weight: 600;
      cursor: pointer; text-decoration: none; transition: background 0.2s;
    }
    .btn:hover { background: #1D4ED8; }
    .note { color: #94A3B8; font-size: 12px; margin-top: 24px; line-height: 1.5; }
    .note a { color: #64748B; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>택배 비서</h1>
    <p class="version" id="version">최신 버전 확인 중...</p>
    <p class="desc">주문 엑셀을 넣으면 택배사 양식으로<br>자동 변환해주는 AI 비서 데스크톱 앱</p>
    <a class="btn" id="download-btn" href="#">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Windows 다운로드
    </a>
    <p class="note">Windows 10 이상 지원<br><a href="https://github.com/shinnanchanguk/shipping-assistant-releases/releases">모든 버전 보기</a></p>
  </div>
  <script>
    fetch('https://api.github.com/repos/shinnanchanguk/shipping-assistant-releases/releases/latest')
      .then(r => r.json())
      .then(data => {
        if (data.tag_name) {
          document.getElementById('version').textContent = data.tag_name;
        }
        const exe = data.assets?.find(a => a.name.endsWith('.exe') && !a.name.endsWith('.sig'));
        if (exe) {
          document.getElementById('download-btn').href = exe.browser_download_url;
        } else {
          document.getElementById('download-btn').href =
            'https://github.com/shinnanchanguk/shipping-assistant-releases/releases/latest';
        }
      })
      .catch(() => {
        document.getElementById('version').textContent = '';
        document.getElementById('download-btn').href =
          'https://github.com/shinnanchanguk/shipping-assistant-releases/releases/latest';
      });
  </script>
</body>
</html>
